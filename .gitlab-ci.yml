image: "docker:stable"

services:
  - docker:dind

variables:
  GIT_STRATEGY: "clone"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG


stages:
  - build
  - package
  - release
  - docker
  
.build_before_script:
  before_script:
    - mkdir -p /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX/$CI_PROJECT_NAMESPACE/
    - ln -s $CI_PROJECT_DIR /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX/$CI_PROJECT_PATH
    - cd /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX/$CI_PROJECT_PATH

.build_fw_dns_plug:
  extends: .build_before_script
  image:  git.mesalab.cn:7443/tango/tsg_master:master
  script:
    - source /etc/profile.d/MESA.sh
    - mkdir -p build
    - cd build
    - cmake ..  -DCMAKE_BUILD_TYPE=$BUILD_TYPE
    - make
    - make package
    
.package_fw_dns_plug:
    extends: .build_before_script
    image:  git.mesalab.cn:7443/tango/tsg_master:master
    script:
      - source /etc/profile.d/MESA.sh
      - mkdir -p build
      - cd build
      - cmake ..  -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      - make package

build:
  stage: build
  extends:   .build_fw_dns_plug
  tags:
    - share
  variables:
    BUILD_TYPE: "Debug"
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    paths:
      -  ./build/*.rpm
  except:
    - tags

fw_dns_plug_debug:
  stage: package
  extends: .package_fw_dns_plug
  tags:
    - share
  variables:
    BUILD_TYPE: "Debug"
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    paths:
      -  ./build/*.rpm
  only:
    - tags
   
fw_dns_plug_release:
  stage: package
  extends: .package_fw_dns_plug
  tags:
    - share
  variables:
    BUILD_TYPE: "Release"
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    paths:
      -  ./build/*.rpm
  only:
    - tags
    
fw_dns_plug_release-release:
  stage: release
  image: git.mesalab.cn:7443/tango/tsg_master:master
  tags:
    - share
  variables:
    ARTIFACTS_JOB: "fw_dns_plug_release"
    PROJECT_NAME: "fw_dns_plug"
    USER_DEFINE: "release"
  only:
    - tags
  script:
    - /bin/bash -x ./autorelease.sh $CI_API_V4_URL $CI_PROJECT_URL $CI_PROJECT_ID $CI_TOKEN $CI_COMMIT_TAG $ARTIFACTS_JOB $PROJECT_NAME $USER_DEFINE
    
fw_dns_plug_debug-release:
  stage: release
  image: git.mesalab.cn:7443/tango/tsg_master:master
  tags:
    - share
  variables:
    ARTIFACTS_JOB: "fw_dns_plug_debug"
    PROJECT_NAME: "fw_dns_plug"
    USER_DEFINE: "release"
  only:
    - tags
  script:
    - /bin/bash -x ./autorelease.sh $CI_API_V4_URL $CI_PROJECT_URL $CI_PROJECT_ID $CI_TOKEN $CI_COMMIT_TAG $ARTIFACTS_JOB $PROJECT_NAME $USER_DEFINE
 
build-docker:
  stage: docker
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  tags:
    - share
  only:
    - master